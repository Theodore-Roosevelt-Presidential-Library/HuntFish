name: Watch regulation pages

on:
  schedule:
    - cron: '17 14 * * 2,5'   # Tuesdays and Fridays, 14:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sources
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare regulation pages with last check
        run: python collector/check_sources.py
      - name: Commit new fingerprints
        run: |
          git config user.name "huntfish-bot"
          git config user.email "huntfish-bot@users.noreply.github.com"
          git add collector/source_hashes.json
          git diff --cached --quiet || git commit -m "Update regulation page fingerprints"
          git pull --rebase --quiet || true
          git push
      - name: Open an issue when a source changed
        if: hashFiles('sources-changed.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Hunting or fishing rules changed: review seasons.json and the trlibrary.com page"
          if [ -z "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')" ]; then
            gh issue create --title "$title" --body-file sources-changed.md
          else
            gh issue comment "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')" --body-file sources-changed.md
          fi
