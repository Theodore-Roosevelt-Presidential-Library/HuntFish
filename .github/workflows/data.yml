name: Refresh land, unit and fishing records

on:
  schedule:
    - cron: '37 9 * * 1'   # Mondays, 09:37 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild data
        run: python collector/build.py
      - name: Commit if changed
        run: |
          git config user.name "huntfish-bot"
          git config user.email "huntfish-bot@users.noreply.github.com"
          git add docs/data/lands.json docs/data/sites.json docs/data/units.json docs/data/waters.json docs/data/places.json docs/data/meta.json
          git diff --cached --quiet || git commit -m "Refresh land, unit and fishing records"
          git pull --rebase --quiet || true
          git push
